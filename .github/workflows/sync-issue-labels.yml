name: Sync Issue Labels

# Mutating: adds/removes only the type:* / area:* / priority:* labels implied by
# the Engineering Task Form's Type / Area / Priority fields. All decision logic
# lives in scripts/sync_issue_labels.py; this file only wires the trigger, a
# least-privilege token, and per-issue serialization. `issues` events carry no
# PR ref, so the checked-out script is always the default branch's — trusted.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  # Serialize runs for one issue; a newer edit queues behind the running one
  # rather than cancelling it mid-mutation.
  group: sync-issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync-issue-labels:
    name: Sync Issue Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync managed labels from the Issue Form
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_issue_labels.py --github-event "$GITHUB_EVENT_PATH" --apply
