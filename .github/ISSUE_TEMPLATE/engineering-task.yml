name: Engineering Task
description: A focused, independently actionable backlog item for evolving the orchestration system.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        One issue = one independently observable outcome. If it has multiple
        independently closable deliverables, split it. Keep each field short —
        this is a Phase-1 engineering-backlog ticket, not a design document or an
        Agent prompt. Large context (requirements, prompts, design) belongs in a
        linked research artifact, ADR, design document, architecture doc, or the
        parent issue. See `policies/github-issue-pr-authoring.md`.

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of work is this?
      options:
        - Feature
        - Refactor
        - Quality
        - Research
        - Documentation
        - Infrastructure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: One stable, high-level category for filtering the backlog. Describes a kind of work on the orchestration system — not which Agent exists today.
      options:
        - Agent Skills
        - Orchestration
        - Agent Contracts
        - Repository Governance
        - GitHub / Workflow
        - Quality / Testing
        - Infrastructure
        - Documentation
        - Research
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 is reserved for exceptional correctness/blocking emergencies and is applied manually by a maintainer — it is not a normal choice here.
      options:
        - P1 — High
        - P2 — Medium
        - P3 — Low
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem, not the implementation.
      placeholder: What problem are we solving, and why does it matter? (1–3 short paragraphs)
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Prefer one clear outcome.
      placeholder: What observable outcome should exist when this issue is complete? (1–2 sentences)
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The work included. Prefer 3–6 focused bullets. Do not restate the problem.
      placeholder: |
        - ...
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-Goals
      description: Use only when needed to protect the boundary. Prefer 0–3 bullets.
      placeholder: What is explicitly out of scope?
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Observable completed state. Prefer 3–6 checks. Do not copy Scope verbatim.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Backlog structure only. Prefer native GitHub sub-issues for parent/child relationships when available.
      value: |
        Depends on: none
        Blocks: none
        Parent: none
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: >
        How completion is verified — e.g. repository validation, tests, link
        validation, manual GitHub behavior verification, or research-source
        verification. Keep it concise (2–5 checks).
      placeholder: How should completion be verified?
    validations:
      required: true
