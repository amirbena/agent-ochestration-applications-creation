# Issue creation routes through the template chooser at /issues/new/choose.
# With more than one Issue Form in this directory, GitHub's "New issue" button
# opens the chooser first, and a form opens only after a template is picked:
#
#   New issue -> choose: Bug Report | Feature Request | Engineering Task
#
# blank_issues_enabled: false removes the "Open a blank issue" escape hatch from
# that chooser, so every reporter lands on a structured form and no Issue is
# created outside a template. Keep it false. Do not add contact_links here
# unless they are real, active destinations — either change would put a bypass
# back on the chooser.
blank_issues_enabled: false
